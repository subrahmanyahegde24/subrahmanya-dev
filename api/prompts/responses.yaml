    Hi there! I'm **IRA** — Subrahmanya's personal AI assistant.
    I can tell you all about his skills, work experience, projects, education, and more.
    What would you like to know?
  patterns:
    - hi
    - hello
    - hey
    - hola
    - howdy
    - sup
    - yo
    - hii
    - hiii
    - good morning
    - good afternoon
    - good evening
